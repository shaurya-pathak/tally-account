<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Tally account</title>
<script>
  // Any unknown path falls back to the single-page site, preserving the path and
  // query so OAuth consent links keep working if the host drops the trailing slash.
  var root = new URL('./', location.href)
  var query = new URLSearchParams(location.search)
  query.set('p', location.pathname)
  root.search = query.toString()
  location.replace(root.href)
</script>
</head>
</html>
