<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Tally account</title>
<script>
  // GitHub Pages serves directories at a trailing slash. Keep the OAuth consent
  // URL stable by handing the authorization_id to the single-page site.
  var root = new URL('../..', location.href)
  var query = new URLSearchParams(location.search)
  query.set('view', 'consent')
  root.search = query.toString()
  location.replace(root.href)
</script>
</head>
</html>
